name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update npm
        run: npm install --global npm@latest
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run lint:md
